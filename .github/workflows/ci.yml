name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      # ffmpeg is optional at runtime; CI installs it so the codec tests run instead of skipping.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install ffmpeg -y --no-progress

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run earwitness --help
