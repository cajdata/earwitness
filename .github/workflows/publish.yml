name: Release

# Publishes to PyPI through trusted publishing (OIDC). Set up on PyPI first: see docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the front end into the package
        working-directory: ui
        run: npm ci && npm run build
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - name: Check that the wheel carries the front end
        run: unzip -l dist/*.whl | grep -q "earwitness/server/static/index.html"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
