[project]
name = "earwitness"
version = "0.0.1"
description = "Geolocate a recording from background thunder or propeller-aircraft sound by matching it against public lightning and ADS-B records. Privacy-awareness proof of concept."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chris Johnson" }]
keywords = ["audio", "geolocation", "doppler", "thunder", "lightning", "ads-b", "privacy", "osint"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "soundfile>=0.12",
]

[project.urls]
Homepage = "https://earwitness.dev"
Source = "https://github.com/cajdata/earwitness"
Issues = "https://github.com/cajdata/earwitness/issues"

[project.scripts]
earwitness = "earwitness.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earwitness"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "NPY", "RUF", "ANN", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
