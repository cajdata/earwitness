[project]
name = "earwitness"
version = "0.1.0"
description = "Geolocate a recording from background thunder or propeller-aircraft sound by matching it against public lightning and ADS-B records. Privacy-awareness proof of concept."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chris Johnson" }]
keywords = ["audio", "geolocation", "doppler", "thunder", "lightning", "ads-b", "privacy", "osint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "fastapi>=0.162.0",
  "h5netcdf>=1.3",
  "h5py>=3.10",
  "numpy>=2.0",
  "pyarrow>=17",
  "pywebview>=6.2.1",
  "rasterio>=1.4",
  "scipy>=1.13",
  "shapely>=2.0",
  "soundfile>=0.12",
  "uvicorn[standard]>=0.54.0",
  "xarray>=2024.6",
]

[project.urls]
Homepage = "https://earwitness.dev"
Source = "https://github.com/cajdata/earwitness"
Issues = "https://github.com/cajdata/earwitness/issues"

[project.scripts]
earwitness = "earwitness.cli:main"

[project.gui-scripts]
# the desktop UI without a console window (pythonw on Windows); same options as `earwitness ui`
earwitness-ui = "earwitness.desktop:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earwitness"]
# the built front end is gitignored but belongs in the wheel; the release workflow builds it first
artifacts = ["src/earwitness/server/static/**/*"]

[tool.hatch.build.targets.sdist]
# what the source distribution holds, listed so nothing else in a local checkout slips in
only-include = [
  "src",
  "tests",
  "docs",
  "scripts",
  "LICENSE",
  "README.md",
  "CONTRIBUTING.md",
  "pyproject.toml",
]
# `uv build` makes the wheel from the sdist, so the sdist must carry the built front end too
artifacts = ["src/earwitness/server/static/**/*"]

[dependency-groups]
build = [
  # the Windows build (packaging/), not needed at runtime
  "pyinstaller>=6.22",
]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "NPY", "RUF", "ANN", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["earwitness"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
  # starlette's test client prefers httpx2; httpx still works and is what the handoff stack implies
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]
